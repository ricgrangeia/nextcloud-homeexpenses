name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Verificar sintaxe
        run: find lib tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      # Correm sem um Nextcloud a volta: tests/bootstrap.php usa os stubs do
      # nextcloud/ocp quando nao encontra um servidor.
      - name: Testes unitarios
        run: vendor/bin/phpunit tests -c tests/phpunit.xml --colors=always

  frontend:
    name: Build do frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build

      # O js/ construido faz parte do que e publicado na App Store, por isso
      # tem de estar commitado e igual ao que o src/ produz. Se divergir, foi
      # commitada uma alteracao ao src sem rebuild.
      - name: Confirmar que o build commitado esta atualizado
        run: |
          if [ -n "$(git status --porcelain js css)" ]; then
            echo "O build em js/ nao corresponde ao src/. Corre 'npm run build' e commita."
            git status --porcelain js css
            git diff --stat js css
            exit 1
          fi
